name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  compatibility:
    name: Node compatibility (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.1.0']
    env:
      CHECK_RELEASE_PLAN: >-
        ${{ matrix.node == '24.1.0' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.user.login == 'viewstem-release[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.ref == github.event.repository.default_branch &&
            github.event.pull_request.head.ref == format('changeset-release/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ env.CHECK_RELEASE_PLAN == 'true' && '0' || '1' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the generated Changesets output
        if: env.CHECK_RELEASE_PLAN == 'true'
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/npm-release.mjs verify-plan
      - name: Build all packages once
        run: npm run build:dom && npm run build -w @viewstem/ui && npm run build -w @viewstem/svelte
      - name: Core tests, types and acceptance coverage
        run: |
          npm run test:report
          npm run typecheck
          npm run check:coverage
          npm run test:ci
      - name: Browser connector and Svelte adapter types
        run: |
          npm run typecheck -w @viewstem/dom
          npm run typecheck -w @viewstem/svelte
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Installed tarball consumers on each Node version
        run: |
          npm run test:package
          npm run test:svelte:package
          npm run test:dom:package

  ui:
    name: Browser and UI consumer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:dom && npm run build -w @viewstem/ui && npm run build -w @viewstem/svelte
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test -w @viewstem/ui
      - run: npm run test -w @viewstem/dom
      - run: npm run test:browser
      - run: npm run test -w @viewstem/svelte

  complete:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI complete' || 'CI complete' }}
    if: ${{ !cancelled() }}
    needs: [compatibility, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite job to pass
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          test "$COMPATIBILITY_RESULT" = success
          test "$UI_RESULT" = success

  release:
    name: Release npm packages
    needs: complete
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository == 'miinhlym/viewstem'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/npm-release.yml
    secrets:
      CLOUDFLARE_PRODUCTION_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
