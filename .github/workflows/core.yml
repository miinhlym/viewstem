name: core

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  docs-label:
    name: Check documentation deployment labels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
      - name: Check the latest PR labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/docs-site-changes.mjs check-pr

  compatibility:
    name: Node compatibility (${{ matrix.node }})
    needs: docs-label
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.docs-label.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.21.1', '24.1.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build all packages once
        run: npm run build:dom && npm run build -w @viewstem/ui && npm run build -w @viewstem/svelte
      - name: Core tests, types and acceptance coverage
        run: |
          npm run test:report
          npm run typecheck
          npm run check:coverage
          npm run test:ci
      - name: Browser connector and Svelte adapter types
        run: |
          npm run typecheck -w @viewstem/dom
          npm run typecheck -w @viewstem/svelte
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Installed tarball consumers on each Node version
        run: |
          npm run test:package
          npm run test:svelte:package
          npm run test:dom:package

  ui:
    name: Browser and UI consumer tests
    needs: docs-label
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.docs-label.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:dom && npm run build -w @viewstem/ui && npm run build -w @viewstem/svelte
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test -w @viewstem/ui
      - run: npm run test -w @viewstem/dom
      - run: npm run test:browser
      - run: npm run test -w @viewstem/svelte

  complete:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI complete' || 'CI complete' }}
    if: ${{ !cancelled() }}
    needs: [docs-label, compatibility, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite job to pass
        env:
          DOCS_LABEL_RESULT: ${{ needs.docs-label.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$DOCS_LABEL_RESULT" != success ]]; then
            echo '::error::The documentation deployment label check did not pass. See the Check documentation deployment labels job.'
            exit 1
          fi
          test "$COMPATIBILITY_RESULT" = success
          test "$UI_RESULT" = success

  release:
    name: npm release
    needs: complete
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'miinhlym/viewstem'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/npm-release.yml
    secrets:
      CLOUDFLARE_PRODUCTION_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
