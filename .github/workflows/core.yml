name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node compatibility (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.21.1', '24.1.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build all packages once
        run: npm run build:svelte && npm run build -w @viewstem/ui
      - name: Core tests, types and acceptance coverage
        run: |
          npm run test:report
          npm run typecheck
          npm run check:coverage
          npm run test:ci
      - name: Svelte adapter types
        run: npm run typecheck -w @viewstem/svelte
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Installed tarball consumers on each Node version
        run: |
          npm run test:package
          npm run test:svelte:package

  ui:
    name: Browser and UI consumer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:svelte && npm run build -w @viewstem/ui
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test -w @viewstem/ui
      - run: npm run test:browser
      - run: npm run test -w @viewstem/svelte

  complete:
    name: CI complete
    if: ${{ !cancelled() }}
    needs: [compatibility, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
      - name: Require every prerequisite job to pass
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          test "$COMPATIBILITY_RESULT" = success
          test "$UI_RESULT" = success

  release:
    name: npm release
    needs: complete
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'miinhlym/viewstem'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/npm-release.yml
