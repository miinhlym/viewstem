name: Docs preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'miinhlym/viewstem' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs-preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
          cache: npm
      - run: npm ci
      - run: npm run build:docs
      - run: node apps/docs/scripts/verify-docs-site.mjs
      - name: Publish the PR Preview
        id: deploy
        env:
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          result="$(npx --no-install wrangler preview --config apps/docs/wrangler.jsonc --name "$PREVIEW_NAME" --json)"
          url="$(jq -er '.preview.urls[0] | select(startswith("https://"))' <<< "$result")"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '[Open the PR preview](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --max-time 15 --output /dev/null "${PREVIEW_URL%/}/docs/installation/"
