name: Docs preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'miinhlym/viewstem' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs-preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
          cache: npm
      - run: npm ci
      - run: npm run build:docs
      - run: node apps/docs/scripts/verify-docs-site.mjs
      - name: Publish the PR Preview
        id: deploy
        env:
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
          PREVIEW_WORKER: viewstem-docs-preview
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_PREVIEW_API_TOKEN docs-preview environment secret}"
          scope_status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/viewstem")"
          case "$scope_status" in
            403|404) ;;
            *) printf 'Expected the token to be denied access to viewstem. HTTP %s\n' "$scope_status" >&2; exit 1 ;;
          esac
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/docs-preview.ndjson"
          npx --no-install wrangler preview --config apps/docs/wrangler.jsonc --worker-name "$PREVIEW_WORKER" --name "$PREVIEW_NAME"
          url="$(jq -ers --arg host "https://$PREVIEW_NAME-$PREVIEW_WORKER.miinhlym.workers.dev" '
            map(select(.type == "preview")) | last | .preview_urls[] | select(rtrimstr("/") == $host)
          ' "$WRANGLER_OUTPUT_FILE_PATH")"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '[Open the PR preview](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --max-time 15 --output /dev/null "${PREVIEW_URL%/}/docs/installation/"
