name: Deploy docs

on:
  workflow_call:
    secrets:
      CLOUDFLARE_PRODUCTION_API_TOKEN:
        required: true
    inputs:
      released_packages:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production
  queue: max

jobs:
  release:
    name: Build, verify, and deploy docs
    if: github.repository == 'miinhlym/viewstem' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: docs-production
      deployment: false
    outputs:
      verified_attempt: ${{ steps.live.outputs.verified_attempt }}
      verified_version: ${{ steps.live.outputs.verified_version }}
    env:
      RELEASED_PACKAGES: ${{ inputs.released_packages }}
      DOCS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
          cache: npm
      - name: Read the active production version
        id: active
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: node .github/scripts/docs-production.mjs read-active
      - name: Check that the workflow commit can deploy
        id: source
        env:
          DOCS_ACTIVE: ${{ steps.active.outputs.deployment }}
        run: node .github/scripts/docs-site-changes.mjs
      - name: Wait for the public package releases
        if: steps.source.outputs.deploy == 'true'
        run: node .github/scripts/verify-docs-release.mjs
      - if: steps.source.outputs.deploy == 'true'
        run: npm ci
      - name: Build with the public npm packages
        if: steps.source.outputs.deploy == 'true'
        env:
          DOCS_BASE_SHA: ${{ steps.source.outputs.base }}
          DOCS_THROUGH_SHA: ${{ steps.source.outputs.through }}
        run: |
          node apps/docs/scripts/build-published.mjs
          node .github/scripts/docs-production.mjs stamp
      - if: steps.source.outputs.deploy == 'true'
        run: node apps/docs/scripts/verify-docs-site.mjs
      - if: steps.source.outputs.deploy == 'true'
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Check the published build in Chromium
        if: steps.source.outputs.deploy == 'true'
        env:
          DOCS_ORIGIN: http://127.0.0.1:4323
          WRANGLER_SEND_METRICS: 'false'
        run: |
          server_log="$(mktemp)"
          ./node_modules/.bin/wrangler dev --config apps/docs/wrangler.jsonc --ip 127.0.0.1 --port 4323 > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then tail -40 "$server_log"; fi
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors --max-time 5 \
            --output /dev/null "$DOCS_ORIGIN/sitemap-index.xml"
          node apps/docs/scripts/verify-site-previews.mjs
      - name: Recheck the public packages
        if: steps.source.outputs.deploy == 'true'
        run: node .github/scripts/verify-docs-release.mjs --availability-only
      - name: Publish the production site
        id: publish
        if: steps.source.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          DOCS_ACTIVE: ${{ steps.active.outputs.deployment }}
          DOCS_BASE_SHA: ${{ steps.source.outputs.base }}
          DOCS_THROUGH_SHA: ${{ steps.source.outputs.through }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_PRODUCTION_API_TOKEN docs-production environment secret}"
          scope_status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/viewstem-preview")"
          case "$scope_status" in
            403|404) ;;
            *) printf 'Expected the token to be denied access to viewstem-preview. HTTP %s\n' "$scope_status" >&2; exit 1 ;;
          esac
          config=apps/docs/wrangler.jsonc
          node .github/scripts/docs-production.mjs assert-active
          previous_version="$(jq -r '.id // empty' <<< "$DOCS_ACTIVE")"
          printf '### Production documentation\n\nPackage release baseline `%s`\n\nSite source `%s`\n\n' "$DOCS_BASE_SHA" "$DOCS_THROUGH_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$previous_version" ]]; then
            printf 'Previous Cloudflare version `%s`\n\n' "$previous_version" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'First Cloudflare deployment\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/docs-production.ndjson"
          npx --no-install wrangler deploy --config "$config" --name viewstem --tag "$DOCS_BASE_SHA.$DOCS_THROUGH_SHA"
          version_id="$(jq -ers 'map(select(.type == "deploy" and .worker_name == "viewstem")) | last | .version_id | strings | select(length > 0)' "$WRANGLER_OUTPUT_FILE_PATH")"
          printf 'Published Cloudflare version `%s`\n\n' "$version_id" >> "$GITHUB_STEP_SUMMARY"
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
      - name: Check the production site
        id: live
        if: steps.source.outputs.deploy == 'true'
        env:
          DOCS_BASE_SHA: ${{ steps.source.outputs.base }}
          DOCS_THROUGH_SHA: ${{ steps.source.outputs.through }}
          DOCS_VERSION_ID: ${{ steps.publish.outputs.version_id }}
        run: |
          node .github/scripts/docs-production.mjs check-live
          printf 'verified_attempt=%s\nverified_version=%s\n' "$GITHUB_RUN_ATTEMPT" "$DOCS_VERSION_ID" >> "$GITHUB_OUTPUT"

  record-deployment:
    name: Record the verified production deployment
    needs: release
    # Rerunning only this job must not record a previously verified version as current.
    if: needs.release.outputs.verified_version != '' && needs.release.outputs.verified_attempt == github.run_attempt
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: docs-production
      url: https://viewstem.miinhlym.workers.dev
    steps:
      - name: Identify the verified Cloudflare version
        env:
          DOCS_VERSION_ID: ${{ needs.release.outputs.verified_version }}
        run: printf 'Verified Cloudflare version `%s`\n' "$DOCS_VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
