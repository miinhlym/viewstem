name: Docs production release

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      released_packages:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA for the documentation build
        type: string
        required: true
      released_packages:
        description: JSON list of public package releases with registry, name, and version
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: docs-production
  queue: max

jobs:
  release:
    if: github.repository == 'miinhlym/viewstem' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: docs-production
      url: https://viewstem.miinhlym.workers.dev
    env:
      RELEASED_PACKAGES: ${{ inputs.released_packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the released source on main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
          cache: npm
      - name: Wait for the public package releases
        run: node .github/scripts/verify-docs-release.mjs
      - run: npm ci
      - name: Build with the public npm packages
        run: node apps/docs/scripts/build-published.mjs
      - run: node apps/docs/scripts/verify-docs-site.mjs
      - run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Check the published build in Chromium
        env:
          DOCS_ORIGIN: http://127.0.0.1:4323
          WRANGLER_SEND_METRICS: 'false'
        run: |
          server_log="$(mktemp)"
          ./node_modules/.bin/wrangler dev --config apps/docs/wrangler.jsonc --ip 127.0.0.1 --port 4323 > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then tail -40 "$server_log"; fi
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors --max-time 5 \
            --output /dev/null "$DOCS_ORIGIN/sitemap-index.xml"
          node apps/docs/scripts/verify-site-previews.mjs
      - name: Verify the packages are still current
        run: node .github/scripts/verify-docs-release.mjs --once
      - name: Publish the production site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_PRODUCTION_API_TOKEN docs-production environment secret}"
          scope_status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/viewstem-preview")"
          case "$scope_status" in
            403|404) ;;
            *) printf 'Expected the token to be denied access to viewstem-preview. HTTP %s\n' "$scope_status" >&2; exit 1 ;;
          esac
          npx --no-install wrangler deploy --config apps/docs/wrangler.jsonc
      - name: Check the production site
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --max-time 15 --output /dev/null https://viewstem.miinhlym.workers.dev/ko/docs/installation/
          curl --fail --silent --show-error --retry 6 --retry-all-errors --max-time 15 --output /dev/null https://viewstem.miinhlym.workers.dev/sitemap-index.xml
