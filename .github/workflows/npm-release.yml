name: Release npm packages

on:
  workflow_call:
    secrets:
      CLOUDFLARE_PRODUCTION_API_TOKEN:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  plan:
    name: Plan and verify npm release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      released_packages: ${{ steps.plan.outputs.released_packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
      - name: Select package versions from the tested commit
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/npm-release.mjs plan
      - if: steps.plan.outputs.targets != '[]'
        run: npm ci --ignore-scripts
      - name: Verify the generated Changesets output
        if: steps.plan.outputs.targets != '[]'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/npm-release.mjs verify-plan

  version:
    name: Update the Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: release-pr
      deployment: false
    permissions:
      contents: read
    concurrency:
      group: changesets-release-pr
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for pending changesets on the current default branch
        id: pending
        env:
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch_sha="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          test -n "$branch_sha"
          if [ "$GITHUB_SHA" = "$branch_sha" ] && compgen -G '.changeset/*.md' | grep -Fxv '.changeset/README.md' > /dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.pending.outputs.exists == 'true'
        with:
          node-version: '24.1.0'
      - if: steps.pending.outputs.exists == 'true'
        run: npm ci --ignore-scripts
      - name: Check for public package version bumps
        if: steps.pending.outputs.exists == 'true'
        id: version-plan
        run: |
          plan="$RUNNER_TEMP/npm-release-plan.json"
          npx --no-install changeset status --output "$plan"
          if jq -e 'any(.releases[]; .type != "none" and (.name | IN("@viewstem/core", "@viewstem/dom", "@viewstem/svelte", "@viewstem/ui")))' "$plan" > /dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Get a Viewstem-only release App token
        if: steps.version-plan.outputs.exists == 'true'
        id: release-app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check the release App identity
        if: steps.version-plan.outputs.exists == 'true'
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: test "$APP_SLUG" = viewstem-release
      - if: steps.version-plan.outputs.exists == 'true'
        uses: changesets/action/version@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ steps.release-app.outputs.token }}
          script: npm run release:version
          commit-message: 'chore: version npm packages'
          pr-title: 'chore: release npm packages'

  publish:
    name: Publish npm packages with OIDC
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - run: npm run build:svelte && npm run build -w @viewstem/ui
      - env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_TARGETS: ${{ needs.plan.outputs.targets }}
        run: node .github/scripts/npm-release.mjs publish

  tag:
    name: Tag and create GitHub releases
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.1.0'
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGETS: ${{ needs.plan.outputs.targets }}
        run: node .github/scripts/npm-release.mjs tag

  docs:
    name: Deploy the documentation for the npm release
    needs: [plan, publish]
    if: needs.plan.outputs.targets != '[]'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-deploy.yml
    secrets:
      CLOUDFLARE_PRODUCTION_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
    with:
      released_packages: ${{ needs.plan.outputs.released_packages }}
